name: Publish container image

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type PUBLISH to build and publish the selected main revision
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'PUBLISH'
    runs-on: ubuntu-24.04
    environment: production-new
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::841125194442:role/FranchiseGithubEcrPublisher
          aws-region: eu-north-1
      - uses: aws-actions/amazon-ecr-login@v2
        id: login-ecr
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.login-ecr.outputs.registry }}/franchisetech-new:${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_APP_URL=https://new.franchisetech.ro
            NEXT_PUBLIC_SITE_URL=https://new.franchisetech.ro
