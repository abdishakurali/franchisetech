name: Deploy new.franchisetech.ro

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type DEPLOY to publish the selected main revision
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-new-franchisetech-ro
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main' && inputs.confirm == 'DEPLOY'
    runs-on: ubuntu-24.04
    environment: production-new
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --run
      - run: npm run typecheck
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Upload release without server secrets
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -az --delete \
            --exclude '.env*' --exclude '.git' --exclude 'node_modules' \
            --exclude '.next' --exclude 'coverage' --exclude 'test-results' \
            --exclude 'playwright-report' --exclude 'backfills' --exclude 'data' \
            --exclude 'outreach' \
            -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes' \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
      - name: Build, start, and verify on EC2
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$DEPLOY_PATH' && test -f .env.production && bash scripts/docker-preflight.sh .env.production && docker compose --env-file .env.production up -d --build && docker compose ps"
